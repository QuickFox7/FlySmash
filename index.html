<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickGame</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 上：ゲーム部分 -->
    <div id="gameContainer">
        <div id="flyBackGround">
            <img id="veranda" src="veranda.png">
        </div>
        <img id="ramune" src="ramune.png">
        <img id="plate" src="plate.png">
        <img id="watermelon" src="watermelon.png">
		<canvas id="splashCanvas"></canvas>
        <canvas id="eatDisplayCanvas"></canvas>
        <div id="raidBanner">
            <div class="raidWarning raidWarningTop">
                <span>WARNING</span>
            </div>

            <div id="raidBannerText">
                <div id="raidBannerIcon">⚠</div>
                <div>ハエ軍団襲来</div>
            </div>

            <div class="raidWarning raidWarningBottom">
                <span>WARNING</span>
            </div>
        </div>
        <div id="raidClearBanner">
            <div id="raidClearBannerText">
                <div id="raidClearBannerIcon">✔</div>
                <div>襲来イベントクリア！</div>
            </div>
        </div>
        <svg id="comboBorder">
            <rect id="comboBorderRect" />
        </svg>
    </div>

    <!-- 下：フラッピーゾーン -->
    <div id="flappyContainer">
        <div id="flappyBgSpace"></div>
        <canvas id="flappyStars"></canvas>
        <div id="flappyBgSky"></div>
        <img id="flappyChar" src="rocket-red.png">
        <div id="flappyGround"></div>
        <canvas id="flappyWind"></canvas>
        <div id="flappyScore">0</div>
        <div id="flappyHigh">
            <div id="flappyHighLine"></div>
            <div id="flappyHighLabel">今回のハイスコア</div>
        </div>
        <div id="flappyHighIndicator">ハイスコアまで </div>
        <div id="flappyBest">
            <div id="flappyBestLine"></div>
            <div id="flappyBestLabel">ベストスコア</div>
        </div>
        <div id="flappyBestIndicator">ベストスコアまで </div>
        <div id="timer">
            <svg id="timerSvg" viewBox="0 0 100 100">
                <!-- 背景 -->
                <circle
                    id="timerBg"
                    cx="50"
                    cy="50"
                    r="45"
                />

                <!-- ゲージ -->
                <circle
                    id="timerGauge"
                    cx="50"
                    cy="50"
                    r="45"
                />
            </svg>

            <div id="timerText">60</div>
        </div>
        <div id="hitPointContainer">
            <div id="hitPointText">LIFE</div>
            <div id="hitPointIcon">❤️❤️❤️</div>
        </div>
        <button class="homeButton" id="gameHomeButton">HOME</button>
    </div>

    <!-- 結果画面 -->
    <div id="resultScreen">
        <div id="resultTitle">RESULT</div>
        <div id="resultScore">SCORE : 0</div>
        <div id="resultBest">過去のベストスコア : 0</div> <!-- モードごとのベストスコア -->
        <div id="resultNewRecord" style="display:none;">NEW RECORD!</div>
        <button class="homeButton" id="resultHomeButton">HOME</button>
    </div>

    <!-- タイトル画面 -->
    <div id="titleScreen">
        <div id="titleHeader">
            <div id="titleLogo">Fly Smash</div>

            <div id="modeSelector">
                <button id="modePrev">◀</button>
                <div id="modeDisplay">∞ エンドレス</div>
                <button id="modeNext">▶</button>
            </div>

            <button id="startButton">START</button>
            <div id="titleBest">BEST : 0</div>
        </div>

        <div id="titleGuide">
            <div class="guideCard">
                <div class="guideIcon">
                    <img class="guideIconImg" src="realisticFly.png" alt="Realistic Fly">
                </div>
                <div class="guideTitle">ハエをクリック！</div>
            </div>

            <div class="guideArrow">▶</div>

            <div class="guideCard">
                <div class="guideIcon">
                    <img class="guideIconImg" src="rocket-red.png" alt="Rocket">
                </div>
                <div class="guideTitle">ロケットをブースト！</div>
            </div>

            <div class="guideArrow">▶</div>

            <div class="guideCard">
                <div class="guideIcon">🏆</div>
                <div class="guideTitle">ハイスコアを目指せ！</div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
